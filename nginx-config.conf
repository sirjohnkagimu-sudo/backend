# Nginx Configuration for Edumall API Performance Optimization
# Copy this to your nginx server block configuration

# Enable gzip compression for faster data transfer
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
gzip_disable "MSIE [1-6]\.";

# Enable HTTP/2 for faster connections
# Note: HTTPS/SSL certificate required for HTTP/2
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#
#     ssl_certificate /path/to/ssl/certificate.crt;
#     ssl_certificate_key /path/to/ssl/private.key;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     # ... rest of configuration
# }

# Connection pooling - keep connections alive
keepalive_timeout 65;
keepalive_requests 100;

# Buffer settings for API responses
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# Cache static assets
location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# API caching configuration
location /api/ {
    # Enable response caching for GET requests
    proxy_cache api_cache;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_x_no_cache;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
